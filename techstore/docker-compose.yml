version: "3.8"

services:
  techstore:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MUTANT: ""
    image: techstore:clean
    container_name: techstore-sut
    user: "node"
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - MUTANT=
    restart: unless-stopped
